<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuesta de Satisfacción - Impresa</title>
<style>
  @page { 
    size: A4; 
    margin: 20mm; 
  }

  body {
    font-family: "Segoe UI", Arial, sans-serif;
    margin: 20px;
    color: #000;
    font-size: 12pt;
    line-height: 1.4;
  }

  header {
    text-align: center;
    margin-bottom: 20px;
  }

  header img {
    max-height: 90px;
    display: block;
    margin: 0 auto 5px auto;
  }

  header h1 {
    font-size: 20pt;
    margin: 5px 0;
    font-weight: 700;
  }

  header p {
    font-size: 10.5pt;
    margin: 2px 0;
    font-weight: 500;
  }

  .section {
    margin-bottom: 20px;
    page-break-inside: avoid;
  }

  .question {
    margin-bottom: 12px;
  }

  .question label {
    font-weight: bold;
    display: block;
    margin-bottom: 4px;
  }

  .options {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .options label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    padding: 5px 8px;
    border: 1px solid #000;
    border-radius: 4px;
    cursor: pointer;
    font-size: 10.5pt;
    min-width: 70px;
    text-align: center;
    background: #fff;
  }

  .options input {
    margin: 0;
    width: 14px;
    height: 14px;
  }

 textarea {
    width: 95%;
    min-height: 80px;
    border: 1px solid #001c70;
    padding: 8px;
    font-size: 14px;
    margin-top: 4px;
    resize: none;
    border-radius: 8px;
  }

  h2 {
    color: #001c70;
    font-size: 14pt;
    margin-bottom: 8px;
  }

  @media print {
    body { margin: 0; }
    header img { max-height: 80px; }
    textarea { min-height: 45px; }
  }
</style>
</head>
<body>

<header>
  <img src="https://i.ibb.co/KppgyhQS/LOGO-NSA-REDONDO.png" alt="Logo Hospital">
  <h1>Encuesta de Satisfacción</h1>
  <p>Hospital y Clínicas Nuestra Señora de la Asunción</p>
  <p>Su opinión es valiosa para ayudarnos a mejorar nuestros servicios. Esta encuesta es anónima.</p>
</header>

<!-- RECEPCIÓN -->
<div class="section">
  <h2>Recepción</h2>
  <div class="question">
    <label>1) ¿Cómo calificaría la atención y amabilidad del personal de Recepción?</label>
    <div class="options">
      <label><input type="checkbox"> Inconforme</label>
      <label><input type="checkbox"> Aceptable</label>
      <label><input type="checkbox"> Regular</label>
      <label><input type="checkbox"> Bueno</label>
      <label><input type="checkbox"> Excelente</label>
    </div>
  </div>

  <div class="question">
    <label>2) ¿El personal de Recepción le brindó información clara y pertinente?</label>
    <div class="options">
      <label><input type="checkbox"> Sí</label>
      <label><input type="checkbox"> No</label>
      <label><input type="checkbox"> Parcialmente</label>
    </div>
  </div>
</div>

<!-- ENFERMERÍA -->
<div class="section">
  <h2>Enfermería</h2>
  <div class="question">
    <label>1) ¿Conoció el nombre del personal de enfermería que le brindó atención durante su estancia hospitalaria?</label>
    <div class="options">
      <label><input type="checkbox"> Sí</label>
      <label><input type="checkbox"> No</label>
      <label><input type="checkbox"> Algunos</label>
    </div>
  </div>

  <div class="question">
    <label>2) ¿El personal de enfermería fue amable y respetuoso durante su estancia?</label>
    <div class="options">
      <label><input type="checkbox"> Siempre</label>
      <label><input type="checkbox"> A veces</label>
      <label><input type="checkbox"> En ningún momento</label>
    </div>
  </div>

  <div class="question">
    <label>3) ¿Recibió un cuidado eficiente, completo y de calidad por parte del personal de enfermería?</label>
    <div class="options">
      <label><input type="checkbox"> Sí</label>
      <label><input type="checkbox"> No</label>
      <label><input type="checkbox"> Parcialmente</label>
    </div>
  </div>

  <div class="question">
    <label>4) ¿El personal de enfermería brindó el tiempo suficiente a todas sus necesidades?</label>
    <div class="options">
      <label><input type="checkbox"> Sí</label>
      <label><input type="checkbox"> No</label>
      <label><input type="checkbox"> No sabría decirlo</label>
    </div>
  </div>

  <div class="question">
    <label>5) Si la respuesta anterior fue "No", indique por qué llegó a esa conclusión.</label>
    <textarea></textarea>
  </div>
</div>

<!-- PERSONAL MÉDICO -->
<div class="section">
  <h2>Personal Médico</h2>
  <div class="question">
    <label>1) ¿El médico residente de turno le brindó una atención profesional, resolutiva y personalizada?</label>
    <div class="options">
      <label><input type="checkbox"> Todo el tiempo</label>
      <label><input type="checkbox"> La mayoría de veces</label>
      <label><input type="checkbox"> Algunas veces</label>
      <label><input type="checkbox"> En ningún momento</label>
    </div>
  </div>

  <div class="question">
    <label>2) ¿El médico residente le explicó su diagnóstico, tratamiento y/o procedimiento de manera clara, atenta y eficiente?</label>
    <div class="options">
      <label><input type="checkbox"> Totalmente</label>
      <label><input type="checkbox"> Algo confusa</label>
      <label><input type="checkbox"> No obtuve una explicación</label>
    </div>
  </div>
</div>

<!-- INTENDENCIA -->
<div class="section">
  <h2>Intendencia e Instalaciones</h2>
  <div class="question">
    <label>1) ¿Todas las áreas del hospital (pasillos, salas, habitaciones, etc.) se encontraban limpias y ordenadas?</label>
    <div class="options">
      <label><input type="checkbox"> Todas</label>
      <label><input type="checkbox"> La mayoría</label>
      <label><input type="checkbox"> Algunas</label>
      <label><input type="checkbox"> Ninguna</label>
      <label><input type="checkbox"> No presté atención</label>
    </div>
  </div>

  <div class="question">
    <label>2) Si alguna área no le pareció agradable, indique cuál fue y qué recomienda para mejorarla.</label>
    <textarea></textarea>
  </div>

  <div class="question">
    <label>3) ¿El personal de intendencia fue amable y realizó su trabajo adecuadamente?</label>
    <div class="options">
      <label><input type="checkbox"> Siempre</label>
      <label><input type="checkbox"> La mayoría de veces</label>
      <label><input type="checkbox"> Algunas veces</label>
      <label><input type="checkbox"> Nunca</label>
      <label><input type="checkbox"> No tuve contacto</label>
    </div>
  </div>
</div>

<!-- SANITARIOS -->
<div class="section">
  <h2>Área de Sanitarios</h2>
  <div class="question">
    <label>1) ¿Los sanitarios se encontraban aseados, con agua, jabón y papel higiénico disponible?</label>
    <div class="options">
      <label><input type="checkbox"> Siempre</label>
      <label><input type="checkbox"> La mayoría de veces</label>
      <label><input type="checkbox"> Algunas veces</label>
      <label><input type="checkbox"> Nunca</label>
    </div>
  </div>

  <div class="question">
    <label>2) ¿La condición de los sanitarios fue satisfactoria durante su estancia?</label>
    <div class="options">
      <label><input type="checkbox"> Totalmente</label>
      <label><input type="checkbox"> Regular</label>
      <label><input type="checkbox"> No</label>
    </div>
  </div>

  <div class="question">
    <label>3) Si la respuesta anterior fue "No", indique cuál fue la razón y qué recomienda para mejorar la situación.</label>
    <textarea></textarea>
  </div>
</div>

</body>
</html>
